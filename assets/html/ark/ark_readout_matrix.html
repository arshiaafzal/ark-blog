<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark: routed readout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#18181b;padding:4px 2px 6px}
  body.dark{color:#e4e4e7}
  .stage{max-width:640px;margin:0 auto;padding:2px 0;text-align:center}
  #eq{font-size:14.5px;overflow-x:auto;overflow-y:hidden;padding:2px 0}
  #eq .katex{font-size:1.05em}
  @media (max-width:560px){#eq{font-size:10.5px}}
</style>
</head>
<body>
<div class="stage">
  <div id="eq"></div>
</div>
<script>
/* Figure 1(a) of the paper: routed readout for five tokens with r = [1, 0, 1, 0, 0] */
let B='#2E6DB4', O='#D9730D';
const r=[1,0,1,0,0];
const cexp=(i,j)=>String.raw`\textcolor{${B}}{\exp\!\left(q_{${i}}^{\top} k_{${j}}\right)}`;
const cphi=(i,j)=>String.raw`\textcolor{${O}}{\phi\!\left(q_{${i}}\right)^{\top}\!\phi\!\left(k_{${j}}\right)}`;
const rows=()=>{const R=[];for(let i=1;i<=5;i++){const c=[];for(let j=1;j<=5;j++)c.push(j>i?'0':(r[j-1]?cexp(i,j):cphi(i,j)));R.push(c.join(' & '))}return R};
const build=()=>String.raw`\def\arraystretch{1.45}\begin{pmatrix}${rows().join(String.raw` \\[3pt] `)}\end{pmatrix}\cdot\begin{pmatrix} v_1^{\top} \\[3pt] v_2^{\top} \\[3pt] v_3^{\top} \\[3pt] v_4^{\top} \\[3pt] v_5^{\top} \end{pmatrix}`;
/* follow the site's light/dark theme */
function isDark(){try{const t=parent.document.documentElement.getAttribute('data-theme');if(t)return t==='dark'}catch(e){}return matchMedia('(prefers-color-scheme: dark)').matches}
function render(){if(!window.katex){setTimeout(render,80);return}
  const d=isDark();document.body.classList.toggle('dark',d);B=d?'#7fb0ee':'#2E6DB4';O=d?'#f2a35c':'#D9730D';
  katex.render(build(),document.getElementById('eq'),{throwOnError:false,displayMode:true})}
render();
try{new MutationObserver(render).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
</script>
</body>
</html>
