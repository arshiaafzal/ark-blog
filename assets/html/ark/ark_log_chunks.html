<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark: log-space chunked prefill</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:4px 2px 6px}
  svg{display:block;width:100%;height:auto;max-width:930px;margin:0 auto}
  /* light theme (paper colors) */
  :root{--ink:#18181b;--note:#52525b;--line:#6b6b73;--grid:#e4e4e7;--frame:#71717a;
        --local:#FAD6BA;--hist:#E0E0E0;--empty:#ffffff;--mean:#BEDCB4;--mass:#70A461;--op:#FFF2CC;--opline:#8a8a90}
  body.dark{--ink:#e4e4e7;--note:#a1a1aa;--line:#a1a1aa;--grid:#3f3f46;--frame:#a1a1aa;
        --local:#6b4527;--hist:#3a3a3f;--empty:#1f1f23;--mean:#3d5a37;--mass:#7fbf6a;--op:#4a4123;--opline:#a1a1aa}
  .t{fill:var(--ink)} .n{fill:var(--note)} .b{font-weight:700}
  .flow{stroke:var(--line);stroke-width:1.2;fill:none}
  .carry{stroke:var(--mass);stroke-width:1.6;fill:none}
  .op{fill:var(--op);stroke:var(--opline);stroke-width:1}
</style>
</head>
<body>
<svg id="fig" viewBox="0 0 930 318" role="img" aria-label="Log-space chunked prefill: local computation per chunk in parallel, a sequential state scan, and a parallel readout">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--line)"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mass)"/></marker>
  </defs>
  <g id="map"></g>
  <g id="rows"></g>
  <g id="cols"></g>
</svg>
<script>
/* Static version of the paper's Figure 6 (log-space chunkwise attention), in the post's notation:
   local scores w_tj, every combine step is a merge of (normalized mean, log-mass) pairs. */
const NS='http://www.w3.org/2000/svg';
const el=(tag,attrs,parent,text)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.innerHTML=text;parent.appendChild(e);return e};
const sub=(base,s)=>`${base}<tspan baseline-shift="sub" font-size="75%">${s}</tspan>`;

/* left: interaction map of 3 chunks x 4 tokens (diagonal blocks are local, below them is history) */
const map=document.getElementById('map'), C=8, ox=14, oy=72;
el('text',{x:ox+48,y:oy-26,'text-anchor':'middle','font-size':14.9,class:'t b'},map,'Chunks');
el('text',{x:ox+48,y:oy-8,'text-anchor':'middle','font-size':12.1,class:'n'},map,'keys');
el('text',{x:ox-6,y:oy+48,'text-anchor':'middle','font-size':12.1,class:'n',transform:`rotate(-90 ${ox-6} ${oy+48})`},map,'queries');
for(let q=0;q<12;q++)for(let k=0;k<12;k++){
  const fill=k>q?'var(--empty)':(Math.floor(k/4)<Math.floor(q/4)?'var(--hist)':'var(--local)');
  el('rect',{x:ox+k*C,y:oy+q*C,width:C,height:C,style:`fill:${fill};stroke:var(--grid);stroke-width:.4`},map);
}
for(let i=0;i<=3;i++){el('line',{x1:ox+i*32,y1:oy,x2:ox+i*32,y2:oy+96,style:'stroke:var(--frame);stroke-width:1'},map);
                      el('line',{x1:ox,y1:oy+i*32,x2:ox+96,y2:oy+i*32,style:'stroke:var(--frame);stroke-width:1'},map)}
[1,2,3].forEach((c,i)=>el('text',{x:ox+16+i*32,y:oy+20+i*32,'text-anchor':'middle','font-size':11.5,class:'t'},map,c));

/* row labels */
const rows=document.getElementById('rows'), LX=165, Y1=78, Y2=190, Y3=268;
[[Y1-10,'1. Local','computation','(parallel)'],[Y2,'2. State scan',''],[Y3,'3. Readout','(parallel)']].forEach(([y,a,b,c2])=>{
  el('text',{x:LX,y:b?y-3:y+4,'text-anchor':'middle','font-size':14.4,class:'t b'},rows,a);
  if(b)el('text',{x:LX,y:y+13,'text-anchor':'middle','font-size':12.6,class:'n'},rows,b);
  if(c2)el('text',{x:LX,y:y+28,'text-anchor':'middle','font-size':12.6,class:'n'},rows,c2);
});

/* chunk columns */
const cols=document.getElementById('cols'), CX=[350,540,730], G=14;
const boxW=78, boxH=30;
el('text',{x:258,y:Y2+4,'text-anchor':'middle','font-size':12.1,class:'n'},cols,'empty');
CX.forEach((cx,c)=>{
  // chunk title and local causal score block
  el('text',{x:cx,y:22,'text-anchor':'middle','font-size':14.4,class:'t b'},cols,`Chunk ${c+1}`);
  const gx=cx-92, gy=36;
  for(let q=0;q<4;q++)for(let k=0;k<4;k++)
    el('rect',{x:gx+k*G,y:gy+q*G,width:G,height:G,style:`fill:${k>q?'var(--empty)':'var(--local)'};stroke:var(--grid);stroke-width:.5`},cols);
  el('rect',{x:gx,y:gy,width:4*G,height:4*G,style:'fill:none;stroke:var(--frame);stroke-width:1'},cols);
  el('text',{x:gx+2*G,y:gy+4*G+15,'text-anchor':'middle','font-size':12.1,class:'n'},cols,'local scores');
  el('text',{x:gx+2*G,y:gy+4*G+28,'text-anchor':'middle','font-size':12.6,class:'n','font-style':'italic'},cols,sub('s','tj'));
  // chunk summary glyph: per-feature mean matrix + log-mass strip
  const sx=cx+20, sy=gy+14, s=8;
  for(let i=0;i<3;i++)for(let j=0;j<4;j++)el('rect',{x:sx+j*s,y:sy+i*s,width:s,height:s,style:'fill:var(--mean);stroke:var(--empty);stroke-width:.8'},cols);
  el('rect',{x:sx,y:sy,width:4*s,height:3*s,style:'fill:none;stroke:var(--frame);stroke-width:.7'},cols);
  el('rect',{x:sx+4*s+4,y:sy,width:s,height:3*s,style:'fill:var(--mass);stroke:var(--frame);stroke-width:.7'},cols);
  el('text',{x:sx+22,y:gy+4*G+15,'text-anchor':'middle','font-size':12.1,class:'n'},cols,'chunk summary');
  el('text',{x:sx+22,y:gy+4*G+28,'text-anchor':'middle','font-size':12.6,class:'n','font-style':'italic','data-vbar':1},cols,`(V, log ${sub('z','loc')})`);
  // summary -> scan merge
  const mx=sx+22;
  el('path',{d:`M${mx},${gy+4*G+36} L${mx},${Y2-boxH/2-2}`,class:'carry','marker-end':'url(#ahg)'},cols);
  el('rect',{x:mx-boxW/2,y:Y2-boxH/2,width:boxW,height:boxH,rx:4,class:'op'},cols);
  el('text',{x:mx,y:Y2-2,'text-anchor':'middle','font-size':12.1,class:'t'},cols,'decay +');
  el('text',{x:mx,y:Y2+10,'text-anchor':'middle','font-size':12.1,class:'t b'},cols,'merge');
  // scan arrow into this merge; the incoming state also feeds this chunk's readout
  const x0=c===0?282:CX[c-1]+20+22+boxW/2, inx=(x0+mx-boxW/2)/2;
  el('path',{d:`M${x0},${Y2} L${mx-boxW/2-2},${Y2}`,class:'carry','marker-end':'url(#ahg)'},cols);
  el('circle',{cx:inx,cy:Y2,r:2.6,style:'fill:var(--mass)'},cols);
  const rx=cx+28;
  el('path',{d:`M${inx},${Y2} L${inx},${Y3-34} L${rx},${Y3-34} L${rx},${Y3-boxH/2-2}`,class:'carry','marker-end':'url(#ahg)'},cols);
  // local scores bypass the scan and go straight to the readout
  el('path',{d:`M${gx+2*G},${gy+4*G+34} L${gx+2*G},${Y3} L${rx-boxW/2-2},${Y3}`,class:'flow','stroke-dasharray':'4 3','marker-end':'url(#ah)'},cols);
  el('rect',{x:rx-boxW/2,y:Y3-boxH/2,width:boxW,height:boxH,rx:4,class:'op'},cols);
  el('text',{x:rx,y:Y3+4,'text-anchor':'middle','font-size':12.1,class:'t b'},cols,'merge');
  el('path',{d:`M${rx},${Y3+boxH/2} L${rx},${Y3+boxH/2+14}`,class:'flow','marker-end':'url(#ah)'},cols);
  el('text',{x:rx,y:Y3+boxH/2+30,'text-anchor':'middle','font-size':12.6,class:'n','font-style':'italic'},cols,`(${sub('o','t')}, log ${sub('z','t')}), t ∈ ${sub('C',c+1)}`);
});
// final state
const lx=CX[2]+20+22+boxW/2;
el('path',{d:`M${lx},${Y2} L${lx+24},${Y2}`,class:'carry','marker-end':'url(#ahg)'},cols);
el('text',{x:lx+30,y:Y2-3,'font-size':12.1,class:'n'},cols,'state');
el('text',{x:lx+30,y:Y2+13,'font-size':12.6,class:'n','font-style':'italic','data-vbar':1},cols,`(${sub('V','acc')}, log ${sub('z','acc')})`);

/* bar over V: measure where the V (2nd character) lands and draw a short line above it */
function vbars(){document.querySelectorAll('line.vbar').forEach(l=>l.remove());
  document.querySelectorAll('text[data-vbar]').forEach(t=>{const e=t.getExtentOfChar(1);
    el('line',{x1:e.x+e.width*0.22,x2:e.x+e.width*0.98,y1:e.y+e.height*0.12,y2:e.y+e.height*0.12,class:'vbar',style:'stroke:var(--note);stroke-width:0.9'},t.parentNode)})}
vbars(); if(document.fonts)document.fonts.ready.then(vbars);
/* follow the site's light/dark theme */
function isDark(){try{const t=parent.document.documentElement.getAttribute('data-theme');if(t)return t==='dark'}catch(e){}return matchMedia('(prefers-color-scheme: dark)').matches}
function theme(){document.body.classList.toggle('dark',isDark())}
theme();
try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
</script>
</body>
</html>
