<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hybrid stacks vs. the Ark stack</title>
<style>
  :root{
    --line:#d4d4d8;
    --lin-bg:#FCEBD7; --lin-bd:#efb27a; --lin-ink:#8a4304;
    --exp-bg:#E9F0FA; --exp-bd:#93b6e2; --exp-ink:#1d4f88;
    --ark-bg:#efeaff; --ark-bd:#a78bfa; --ark-ink:#4c3bcf;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#18181b;padding:4px 2px 6px}
  .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:620px;margin:0 auto}
  .model{background:#fff;border:1px solid #ececef;border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;align-items:center}
  .stack{width:100%;display:flex;flex-direction:column;align-items:center}
  .wire{width:1.5px;background:var(--line);flex:none}
  .stack>.wire{height:7px}
  .vdots{font-size:13px;line-height:10px;color:#a1a1aa;margin:1px 0 3px}
  .box{width:100%;text-align:center;font-size:10px;font-weight:600;border:1px solid;border-radius:6px;padding:4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lin{background:var(--lin-bg);border-color:var(--lin-bd);color:var(--lin-ink)}
  .exp{background:var(--exp-bg);border-color:var(--exp-bd);color:var(--exp-ink)}
  .ark{background:var(--ark-bg);border-color:var(--ark-bd);color:var(--ark-ink);font-weight:700}
  .name{margin-top:8px;font-size:11px;font-weight:700;color:#27272a;text-align:center}
  .name a{color:inherit;text-decoration:none;border-bottom:1px solid #c4c4ca}
  .name a:hover{border-bottom-color:#27272a}
  @media (max-width:520px){.wrap{gap:6px}.model{padding:8px 5px 6px}.box{font-size:7.5px;padding:3px 2px}.name{font-size:9.5px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
/* a slice of 8 sequence mixers from the middle of each model, bottom to top (channel mixers omitted) */
const MODELS=[
  {name:'Kimi K3', url:'https://arxiv.org/abs/2607.24653',
   layers:i=>(i%4===3)?['exp','MLA']:['lin','KDA']},
  {name:'Qwen3.8-Flash-Next', url:'https://qwen.ai/blog?id=qwen3.8-flash-next',
   layers:i=>(i%4===3)?['exp','Gated Attention']:['lin','Gated DeltaNet']},
  {name:'Ark (ours)', url:null,
   layers:()=>['ark','Ark']},
];
const L=8;
const wrap=document.getElementById('wrap');
for(const m of MODELS){
  const layers=[];
  for(let i=L-1;i>=0;i--){
    const [cls,label]=m.layers(i);
    layers.push(`<div class="box ${cls}">${label}</div>`);
  }
  const name=m.url?`<a href="${m.url}" target="_blank" rel="noopener">${m.name}</a>`:m.name;
  wrap.insertAdjacentHTML('beforeend',`<div class="model"><div class="stack"><div class="vdots">⋮</div>${layers.join('<div class="wire"></div>')}<div class="vdots" style="margin:3px 0 0">⋮</div></div><div class="name">${name}</div></div>`);
}
</script>
</body>
</html>
