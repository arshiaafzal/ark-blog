function recall(rows,extra){return{
  groups:[['',5],['Memory (M)',3],['Recall',3],['NIAH-1',3],['NIAH-2',3],['NIAH-3',3]],
  cols:['Model','Params (M)','State','KV','Total','SWDE','FDA','SQuAD','2k','4k','8k','2k','4k','8k','2k','4k','8k'].filter((_,i)=>i!==99),
  memcols:[2,3,4],skipBest:[1],rows,
  cap:extra+' Recall-task and NIAH accuracy (%). Memory: millions of stored elements at 8K context. Ark is highlighted. Bold: best per column (smallest for memory); underlined: second best.'}}
// fix group widths for recall tables (Model + Params = 2 columns)
['r400','r800','r2b'].forEach(k=>T[k].groups=[['',2],['Memory (M)',3],['Recall',3],['NIAH-1',3],['NIAH-2',3],['NIAH-3',3]]);
T.lm.groups=[['',2],['Memory (M)',3],['LAMBADA',2],['',6]];
T.ruler.groups=[['',1],['Memory (M)',3],['VT',3],['CWE',3],['FWE',3],['QA-SQuAD',3],['QA-Hotpot',3],['BABILong',3]];
T.niah.groups=[['',1],['Memory (M)',3],['MK1',3],['MK2',3],['MK3',3],['MV',3],['MQ',3]];
T.qa.groups=[['',1],['Memory (M)',3],['Open-book QA accuracy (%)',6]];
/* ?group=lm|recall|ruler|recall_ruler shows only that section's tables (default: all tabs) */
const GROUPS={lm:['lm'],recall:['r400','r800','r2b'],ruler:['ruler','niah','qa'],recall_ruler:['r400','r800','r2b','ruler','niah','qa']};
const keys=GROUPS[new URLSearchParams(location.search).get('group')]||Object.keys(T);
const tabs=document.getElementById('tabs');
keys.forEach(k=>{const b=document.createElement('button');b.textContent=T[k].name;b.dataset.k=k;b.onclick=()=>show(k);tabs.appendChild(b)});
if(keys.length===1)tabs.style.display='none';
function show(k){
  const d=T[k];document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  const data=d.rows.filter(r=>r[0]!=='g');
  const nc=d.cols.length, best={}, second={};
  for(let c=1;c<nc;c++){
    if(d.skipBest.includes(c)) continue;
    const vals=data.map(r=>r[c]);
    const isMem=d.memcols.includes(c), low=(d.lower||[]).includes(c)||isMem;
    /* best and second-best distinct values (memory columns: smallest wins, zero excluded) */
    const u=[...new Set(vals.filter(v=>!(isMem&&v===0)))].sort((a,b)=>low?a-b:b-a);
    best[c]=u[0]; if(u.length>1) second[c]=u[1];
  }
  let h='<thead><tr class="g">'+d.groups.map(([n,s])=>`<th colspan="${s}">${n}</th>`).join('')+'</tr><tr>'+d.cols.map((c,i)=>`<th${i===0?' style="text-align:left"':''}>${c}</th>`).join('')+'</tr></thead><tbody>';
  d.rows.forEach(r=>{
    if(r[0]==='g'){h+=`<tr class="grp"><td colspan="${nc}">${r[1]}</td></tr>`;return}
    h+=`<tr class="${r[0]==='Ark'?'ark':''}">`+r.map((v,i)=>{
      if(i===0) return `<td class="name">${v}</td>`;
      const isMem=d.memcols.includes(i);
      const b=best[i]!==undefined && v===best[i] && !(isMem&&v===0);
      const s2=second[i]!==undefined && v===second[i] && !(isMem&&v===0);
      return `<td class="${isMem?'mem':''}${b?' best':''}${s2?' second':''}">${typeof v==='number'?(Number.isInteger(v)&&!isMem&&i>1&&v!==100?v.toFixed(1):v):v}</td>`}).join('')+'</tr>';
  });
  document.getElementById('t').innerHTML=h+'</tbody>';
  document.getElementById('cap').textContent=d.cap;
  fit();
}
/* shrink the font just enough for wide tabs to fit the column (min 9px); narrower screens still scroll */
function fit(){const t=document.getElementById('t'), box=t.closest('.scroll');
  t.style.fontSize='';const base=parseFloat(getComputedStyle(t).fontSize);
  if(t.scrollWidth>box.clientWidth+1){t.style.fontSize=Math.max(9,base*box.clientWidth/t.scrollWidth*0.98)+'px';
    if(t.scrollWidth>box.clientWidth+1)t.style.fontSize=Math.max(9,parseFloat(t.style.fontSize)*box.clientWidth/t.scrollWidth*0.98)+'px'}}
addEventListener('resize',fit);
show(keys.includes('r2b')?'r2b':keys[0]);
</script>
<script>
/* frameless on the light theme; on the dark theme keep a white panel behind the figure */
(()=>{const dark=()=>{try{const t=parent.document.documentElement.getAttribute('data-theme');if(t)return t==='dark'}catch(e){}return matchMedia('(prefers-color-scheme: dark)').matches};
 const set=()=>document.body.classList.toggle('dark',dark());set();
 try{new MutationObserver(set).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}})();
</script>
