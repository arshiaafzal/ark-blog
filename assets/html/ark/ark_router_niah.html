<html lang="en">

<meta charset="UTF-8">

<title>Ark: router score while reading a needle in a haystack</title>
<style>
  :root{--kv:#2E6DB4;--kv-bg:#E9F0FA;--kv-ink:#1d4f88;--st:#D9730D;--st-bg:#FCEBD7;--st-ink:#8a4304;

  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}

  .ttl span{display:block;font-size:10.5px;font-weight:500;color:var(--label);margin-top:1px}
  .lg{display:flex;gap:10px;font-size:10.5px;color:#52525b;align-items:center}
  .lg i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid;margin-right:4px;vertical-align:-1px}
  .cap{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--label);text-align:center}
  .window{position:relative;height:30px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
  .track{position:absolute;top:4px;left:0;display:flex;gap:5px;transition:transform .12s linear;will-change:transform}
  .chip{font-family:var(--mono);font-weight:700;font-size:10.5px;line-height:1;padding:5px 6px;border-radius:6px;border:1px solid #d4d4d8;background:#f4f4f5;color:#3f3f46;white-space:nowrap;
    transition:background-color .25s,border-color .25s,color .25s}
  .chip .sp{opacity:.4;font-weight:400}
  .chip.kv{background:var(--kv-bg);border-color:var(--kv);color:var(--kv-ink)}
  .chip.st{background:var(--st-bg);border-color:#f0b47a;color:var(--st-ink)}
  .chip.needle{box-shadow:0 0 0 2px rgba(46,109,180,.18)}
  .headmark{position:absolute;left:50%;top:0;bottom:0;width:0;border-left:1.5px dashed #a1a1aa;transform:translateX(-.75px);z-index:2}
  body.dark{color:#e4e4e7}
  body.dark .ttl span,body.dark .lg,body.dark .cap{color:#a1a1aa}
  body.dark .chip{background:#2a2a2e;border-color:#3f3f46;color:#a1a1aa}
  body.dark .chip.st{background:#3a2a1a;border-color:#7a4a1c;color:#f2b880}
  body.dark .chip.kv{background:#1c2f48;border-color:#7fb0ee;color:#cfe3fb}
  body.dark .headmark{border-left-color:#71717a}
  body.dark .ctrl button{background:#27272a;border-color:#3f3f46;color:#a1a1aa}
  .plot{position:relative;height:150px;margin-top:6px}
  canvas{width:100%;height:100%;display:block}
  .ctrl{display:inline-flex;gap:3px;margin-left:4px}
  .ctrl button{font:inherit;font-size:8px;color:var(--label);background:#fff;border:1px solid #e4e4e7;border-radius:999px;padding:1px 7px;cursor:pointer}
</style>
</head>
