<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark: learning what to keep</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1e293b;background:transparent;padding:4px 2px 6px}
  .wrap{max-width:680px;margin:0 auto;padding:4px 0}
  .tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  .tabs button{font:inherit;font-size:11.5px;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;color:#1e293b}
  .tabs button.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .box{position:relative;height:300px}
  .legend{display:flex;gap:6px 14px;justify-content:center;font-size:11px;color:#475569;margin-top:8px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .cap{font-size:11px;color:#64748b;text-align:center;margin-top:6px;line-height:1.45}
  body.dark .wrap{background:#fff;border-radius:14px;padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="box"><canvas id="c"></canvas></div>
  <div class="legend" id="legend"></div>
  <div class="cap" id="cap"></div>
</div>
<script>
/* Tables 6 and 11 of the paper. Ark = purple, alternatives = gray. */
const V={
  eviction:{
    tab:'vs. KV eviction',
    labels:['SWDE','FDA','NIAH-1 2K','NIAH-1 4K','NIAH-2 2K','NIAH-2 4K','NIAH-3 2K','NIAH-3 4K'],
    series:[
      ['Eviction 400M','#d4d9e1',[50.4,31.6,97,23,90,24,46,8]],
      ['Ark 400M','#c9b8f2',[53.8,71.9,100,100,100,89.9,70.1,81.8]],
      ['Eviction 800M','#a9b2bf',[59.5,41.9,100,98,94,46,50,25]],
      ['Ark 800M','#9d82e6',[65.1,81.3,100,100,100,100,99.8,99.6]],
      ['Eviction 2B','#7d8898',[78.8,71.1,100,100,100,96,100,37]],
      ['Ark 2B','#6a45d0',[78.0,79.5,100,100,100,100,92.2,88.4]],
    ],
    cap:'Accuracy (%) at equal memory. Eviction is the per-task best of StreamingLLM, H2O, SnapKV and AdaKV on RoPE, NoPE and FoX Transformers, an upper bound no single policy reaches.'},
  policy:{
    tab:'vs. random / periodic',
    labels:['SWDE','FDA','SQuAD','NIAH-1 1K','NIAH-1 2K','NIAH-2 1K','NIAH-2 2K','NIAH-3 1K','NIAH-3 2K'],
    series:[
      ['Learned (10.6% KV)','#7c5cd6',[53.8,71.9,30.5,100,100,100,100,75.2,70.1]],
      ['Periodic (9.8%)','#7d8898',[20.2,15.4,17.4,67.2,22.8,85.0,57.8,6.6,1.8]],
      ['Random (9.1%)','#a9b2bf',[25.2,17.0,16.3,42.4,24.8,60.4,41.0,6.6,2.2]],
      ['Periodic (19.7%)','#c7cdd6',[27.5,39.6,18.0,83.8,30.4,99.4,95.6,17.4,10.6]],
      ['Random (48.5%)','#e2e6ec',[39.3,49.6,22.9,94.8,89.4,97.2,96.6,49.0,31.0]],
    ],
    cap:'Accuracy (%) of ~400M models with identical architecture and training; only the KV allocation differs. The KV budget is in brackets.'}
};
let chart;
function show(k){
  const v=V[k];
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.getElementById('legend').innerHTML=v.series.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('');
  document.getElementById('cap').textContent=v.cap;
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('c'),{type:'bar',
    data:{labels:v.labels,datasets:v.series.map(([n,c,d])=>({label:n,data:d,backgroundColor:c,borderRadius:{topLeft:3,topRight:3},borderSkipped:'bottom',barPercentage:.9,categoryPercentage:.82}))},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:400},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e293b',padding:7,cornerRadius:6,callbacks:{label:(c)=>`${c.dataset.label}: ${c.raw}%`}}},
      scales:{x:{grid:{display:false},border:{color:'#cbd5e1'},ticks:{color:'#475569',font:{size:10.5},maxRotation:0,autoSkip:false}},
        y:{min:0,max:100,grid:{color:'#f1f5f9'},border:{display:false},ticks:{color:'#94a3b8',font:{size:10},stepSize:25},
          title:{display:true,text:'Accuracy (%)',color:'#64748b',font:{size:10.5}}}}}});
}
const tabs=document.getElementById('tabs');
Object.entries(V).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v.tab;b.dataset.k=k;b.onclick=()=>show(k);tabs.appendChild(b)});
show(new URLSearchParams(location.search).get('v')||'eviction');
</script>
<script>
/* frameless on the light theme; on the dark theme keep a white panel behind the figure */
(()=>{const dark=()=>{try{const t=parent.document.documentElement.getAttribute('data-theme');if(t)return t==='dark'}catch(e){}return matchMedia('(prefers-color-scheme: dark)').matches};
 const set=()=>document.body.classList.toggle('dark',dark());set();
 try{new MutationObserver(set).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}})();
</script>
</body>
</html>
