<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ark: how Ark uses its two memories</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1e293b;background:transparent;padding:4px 2px 6px}
  .wrap{max-width:680px;margin:0 auto;padding:4px 0}
  .panels{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:22px}
  .ttl{font-size:11.5px;font-weight:600;color:#475569;margin:0 0 2px 4px}
  .box{position:relative}
  .cap{font-size:11px;color:#64748b;text-align:center;margin-top:6px}
  @media (max-width:620px){.panels{grid-template-columns:minmax(0,1fr);gap:12px}}
  body.dark .wrap{background:#fff;border-radius:14px;padding:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="panels">
    <div><div class="ttl">Experiment 1 · force every entry into one memory</div><div class="box" style="height:330px"><canvas id="e1"></canvas></div></div>
    <div><div class="ttl">Experiment 2 · move only the answer tokens</div><div class="box" style="height:190px"><canvas id="e2"></canvas></div></div>
  </div>
  <div class="legend" style="display:flex;gap:6px 14px;justify-content:center;font-size:11px;color:#475569;margin-top:8px;flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:11px;height:11px;border-radius:3px;background:#7c5cd6"></i>Learned routing</span>
    <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:11px;height:11px;border-radius:3px;background:#7d8898"></i>All KV cache</span>
    <span style="display:inline-flex;align-items:center;gap:5px"><i style="width:11px;height:11px;border-radius:3px;background:#c7cdd6"></i>All recurrent state / answer tokens → recurrent state</span>
  </div>
  <div class="cap">Accuracy (%) of the same trained ~400M Ark, with routing overridden at inference and no change to the weights.</div>
</div>
<script>
const font='-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
function hbars(id,labels,series,xmax){
  new Chart(document.getElementById(id),{type:'bar',
    data:{labels,datasets:series.map(([n,c,d])=>({label:n,data:d,backgroundColor:c,borderRadius:3,barPercentage:.92,categoryPercentage:.8}))},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e293b',padding:7,cornerRadius:6,callbacks:{label:(c)=>`${c.dataset.label}: ${c.raw}%`}}},
      scales:{x:{min:0,max:xmax,grid:{color:'#f1f5f9'},border:{display:false},ticks:{color:'#94a3b8',font:{size:10},stepSize:25}},
        y:{grid:{display:false},border:{color:'#cbd5e1'},ticks:{color:'#475569',font:{size:10.5}}}}}});
}
/* Tables 12-13 of the paper */
hbars('e1',['SWDE','FDA','SQuAD','LAMBADA','PIQA','WinoGrande','ARC-e'],[
  ['Learned routing','#7c5cd6',[53.8,71.9,30.5,31.5,63.5,52.5,44.1]],
  ['All KV cache','#7d8898',[27.8,35.7,30.2,26.6,63.0,51.0,41.9]],
  ['All recurrent state','#c7cdd6',[5.9,0.0,4.5,0.6,61.9,53.0,41.5]]],100);
hbars('e2',['SWDE','FDA','SQuAD','Mean'],[
  ['Learned routing','#7c5cd6',[53.8,71.9,30.5,52.1]],
  ['Answer tokens → recurrent state','#c7cdd6',[16.2,4.8,4.2,8.4]]],100);
</script>
<script>
/* frameless on the light theme; on the dark theme keep a white panel behind the figure */
(()=>{const dark=()=>{try{const t=parent.document.documentElement.getAttribute('data-theme');if(t)return t==='dark'}catch(e){}return matchMedia('(prefers-color-scheme: dark)').matches};
 const set=()=>document.body.classList.toggle('dark',dark());set();
 try{new MutationObserver(set).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}})();
</script>
</body>
</html>
